<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Vẽ Tranh 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        /* Khung hiển thị 3D */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Thanh công cụ điều khiển */
        .toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        select, input, button {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 13px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button.active {
            background-color: #28a745;
        }
        button.danger {
            background-color: #dc3545;
        }
        .instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <!-- Nhập thư viện Three.js và OrbitControls để xoay camera 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Thanh công cụ -->
    <div class="toolbar">
        <div class="tool-group">
            <button id="btn-mode" class="active" onclick="toggleMode()">🎨 Chế độ: VẼ</button>
        </div>

        <div class="tool-group">
            <label>Hình:</label>
            <select id="shape-select">
                <option value="sphere">Hình cầu</option>
                <option value="box">Hình hộp</option>
                <option value="torus">Vòng nhẫn</option>
                <option value="cylinder">Hình trụ</option>
            </select>
        </div>

        <div class="tool-group">
            <label>Màu:</label>
            <input type="color" id="color-picker" value="#00ffcc">
        </div>

        <div class="tool-group">
            <label>Size:</label>
            <input type="range" id="size-slider" min="0.1" max="2" step="0.1" value="0.5">
        </div>

        <button class="danger" onclick="clearCanvas()">🗑️ Xóa hết</button>
    </div>

    <div class="instructions" id="instruction-text">
        Chế độ VẼ: Chạm/kéo tay trên màn hình để vẽ nét 3D
    </div>

    <!-- Container cho canvas 3D -->
    <div id="canvas-container"></div>

    <script>
        // 1. Cấu hình Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 2. Thêm Ánh sáng (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Thêm lưới mặt phẳng tham chiếu (Grid)
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 3. Điều khiển xoay Camera (Orbit Controls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enabled = false; // Mặc định tắt để ưu tiên vẽ

        // 4. Biến quản lý vẽ
        let isDrawingMode = true;
        let isMouseDown = false;
        const drawnObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 5. Chuyển đổi giữa chế độ Xoay góc nhìn và Vẽ
        function toggleMode() {
            isDrawingMode = !isDrawingMode;
            controls.enabled = !isDrawingMode;

            const btn = document.getElementById('btn-mode');
            const info = document.getElementById('instruction-text');

            if (isDrawingMode) {
                btn.innerText = "🎨 Chế độ: VẼ";
                btn.className = "active";
                info.innerText = "Chế độ VẼ: Chạm/kéo tay trên màn hình để vẽ nét 3D";
            } else {
                btn.innerText = "🔄 Chế độ: XOAY 3D";
                btn.className = "";
                info.innerText = "Chế độ XOAY: Dùng 1 tay để xoay, 2 tay để phóng to/thu nhỏ góc nhìn";
            }
        }

        // 6. Hàm tạo khối 3D tại tọa độ vẽ
        function create3DShape(position) {
            const shapeType = document.getElementById('shape-select').value;
            const color = document.getElementById('color-picker').value;
            const size = parseFloat(document.getElementById('size-slider').value);

            let geometry;
            if (shapeType === 'sphere') {
                geometry = new THREE.SphereGeometry(size, 16, 16);
            } else if (shapeType === 'box') {
                geometry = new THREE.BoxGeometry(size, size, size);
            } else if (shapeType === 'torus') {
                geometry = new THREE.TorusGeometry(size, size * 0.3, 8, 24);
            } else if (shapeType === 'cylinder') {
                geometry = new THREE.CylinderGeometry(size * 0.5, size * 0.5, size, 16);
            }

            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.2
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            scene.add(mesh);
            drawnObjects.push(mesh);
        }

        // 7. Xử lý sự kiện Chạm / Chuột để vẽ
        function onPointerMove(event) {
            if (!isDrawingMode || !isMouseDown) return;

            let x, y;
            if (event.touches) {
                x = event.touches[0].clientX;
                y = event.touches[0].clientY;
            } else {
                x = event.clientX;
                y = event.clientY;
            }

            // Chuyển tọa độ màn hình thành tọa độ 3D
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Tính toán vị trí vẽ cách camera một khoảng cố định (z = 0)
            const targetZ = 0;
            const distance = (targetZ - camera.position.z) / raycaster.ray.direction.z;
            const drawPos = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance));

            create3DShape(drawPos);
        }

        // Lắng nghe sự kiện Chuột & Cảm ứng điện thoại
        window.addEventListener('mousedown', (e) => { if(e.target.tagName === 'CANVAS') isMouseDown = true; });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', onPointerMove);

        window.addEventListener('touchstart', (e) => { if(e.target.tagName === 'CANVAS') isMouseDown = true; });
        window.addEventListener('touchend', () => isMouseDown = false);
        window.addEventListener('touchmove', onPointerMove);

        // 8. Xóa toàn bộ các hình đã vẽ
        function clearCanvas() {
            drawnObjects.forEach(obj => scene.remove(obj));
            drawnObjects.length = 0;
        }

        // 9. Cập nhật kích thước khi xoay màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 10. Vòng lặp Render 3D
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
